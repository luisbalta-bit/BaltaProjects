<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dehesa — Palavra-passe</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='editor.css') }}?v=2">
</head>
<body class="login-page">
<form class="login" method="post">
  <div class="wordmark">DEHESA</div>
  <h1 class="serif">Mudar palavra-passe</h1>
  {% if done %}
    <div class="summary" role="status">Palavra-passe alterada. As sessões abertas noutros dispositivos foram terminadas.</div>
    <a class="btn btn-dark" href="{{ url_for('index') }}">Voltar ao editor</a>
  {% else %}
    {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
    <label>Palavra-passe atual<input name="current" type="password" autocomplete="current-password" required autofocus></label>
    <label>Nova palavra-passe <span class="small">(mínimo 10 caracteres)</span><input name="new" type="password" autocomplete="new-password" minlength="10" required></label>
    <label>Repetir a nova<input name="repeat" type="password" autocomplete="new-password" minlength="10" required></label>
    <button class="btn btn-dark">Guardar</button>
    <a class="link" href="{{ url_for('index') }}">Cancelar</a>
  {% endif %}
</form>
</body>
</html>
